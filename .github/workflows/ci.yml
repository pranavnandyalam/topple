name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two jobs in parallel, so neither runs close to its timeout. On the 2-vCPU runner the whole suite
# under coverage took 294-599 s between two runs of the same commit (2x runner variance); `python`
# runs everything but the `slow` seed sweeps with coverage (about 70% of that), `python-slow` runs
# the sweeps without coverage. Each job's timeout leaves room for another 2x slowdown plus growth.
# Golden scores: these jobs enforce the linux-x86_64 pins; darwin-arm64 pins are enforced only by
# test runs on Apple Silicon (tests/test_golden.py says how to re-pin both).
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install headless OpenGL (OSMesa)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libosmesa6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      # No MUJOCO_GL here on purpose: CI must exercise topple's headless default (osmesa).
      # faulthandler_timeout prints every thread's stack if one test runs past 10 minutes.
      - name: Test
        run: >-
          uv run pytest -n auto -m "not slow" -o faulthandler_timeout=600
          --cov --cov-report=term-missing

  python-slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install headless OpenGL (OSMesa)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libosmesa6
      - run: uv sync --locked
      # Seed sweeps over whole protocols, without coverage tracing: every line they reach is
      # already covered by the fast job (98.6% either way, measured).
      - name: Test (slow)
        run: uv run pytest -n auto -m slow -o faulthandler_timeout=600
