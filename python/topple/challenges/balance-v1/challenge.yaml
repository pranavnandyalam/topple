# balance-v1: keep a two-wheeled balancer upright for 10 s. Frozen once published: any change that
# can move a fixed controller's score on a fixed seed requires balance-v2 (docs/contract.md §13).
id: balance-v1
obs_schema: balancer.obs.v1
action_spec: diffdrive.effort.v1
robot: robot/balancer.xml
params: robot/params.yaml
scene: scene.xml
control_dt: 0.01
episode_seconds: 10.0
presets: [ideal, clean, standard]
# Calibrated on 200 held-out seeds (0..199), pushes U(0.25, 0.45) N.s, after the phase 1 fixes
# (current-state fall check, reset-relative energy seed, platform-independent scenario draws;
# ENV_ALGO_VERSION 1). The calibration platform is linux-x86_64, where ranked scores come from:
#   linux-x86_64 (2026-10-15):
#     clean:    LQR 100.0%, PID 100.0% survival
#     standard: LQR  87.5% (median 3.28 J), shipped PID 65.0% (median 6.5655 J)
#   darwin-arm64 (2026-10-11, the development platform; E_ref would round to 13.0 there):
#     clean:    LQR 100.0%, PID 100.0% survival
#     standard: LQR  86.5% (median 3.26 J), shipped PID 64.5% (median 6.49 J)
score:
  e_ref_j: 13.1         # 2x the shipped PID's median battery energy on standard, linux-x86_64 (2 x 6.5655 J)
  tilt_ref_rad: 0.2
  drift_ref_m: 1.0
  success_max_drift_m: 1.0
  success_energy_factor: 5.0
seeds:
  public: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
           1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019]
