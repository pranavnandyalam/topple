[project]
name = "topple-sim"
version = "0.1.0"
description = "CI for robots: push a controller, get a score, a crash-test rating and a replay."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.15,<3.16",
    "gymnasium>=1.4,<1.5",
    "numpy>=2.0",
    "onnxruntime>=1.31",
    "typer>=0.27",
    "imageio>=2.38",
    "imageio-ffmpeg>=0.6",
    "pydantic>=2.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.9",
    "torch>=2.14",
    "tensorboard>=2.21",
    "onnx>=1.23",
]

[project.scripts]
topple = "topple.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8",
    "hypothesis>=6.168",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/topple"]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.18"  # earlier releases have published advisories
# Prefer a system/Homebrew interpreter over uv-managed ones: on this Apple Silicon setup a stray
# uv-managed x86_64 (Rosetta) CPython would otherwise win discovery and fail the platform-restricted
# lock below. This does not pin the CPU architecture; see README for the recovery commands.
python-preference = "system"
# onnxruntime has no Intel-mac wheels; resolve only for platforms we support.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

# Linux (CI) pulls the 196 MB CPU torch wheel instead of the multi-GB CUDA build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # the Phase 2 scripts (phase2_common, phase2_gate, ...) for their tests
addopts = "-ra --strict-markers"
markers = [
    "render: needs a headless OpenGL backend (cgl on macOS, osmesa/egl on Linux)",
    "slow: takes more than a few seconds",
    "train: needs the train extra (torch, stable-baselines3); the python-train CI job runs these",
]

[tool.coverage.run]
source = ["topple"]
branch = true
# The torch modules (train extra) are measured by the python-train job (.coveragerc-train), so
# the default job's 80% scope and the train job's are disjoint (docs/design/phase-2.md §7).
omit = [
    "*/topple/train/learn.py",
    "*/topple/train/snapshot.py",
    "*/topple/train/callbacks.py",
    "*/topple/train/surgery.py",
    "*/topple/train/resources.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "scripts", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "NPY", "C4", "PIE", "RET"]

[tool.mypy]
python_version = "3.12"
files = ["python/topple", "scripts"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "mujoco.*",
    "imageio.*",
    "gymnasium.*",
    "onnxruntime.*",
    "stable_baselines3.*",
    "cma.*",
    "google.protobuf.*",
]
ignore_missing_imports = true
